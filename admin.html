<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Lolita Loja</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
  body { background: #f5f0ee; min-height: 100vh; }
  .login-caixa { max-width: 400px; margin: 80px auto; background: #fff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.1); }
  .login-caixa h1 { font-size: 1.5rem; margin-bottom: .35rem; color: #333; }
  .login-subtitulo { color: #888; font-size: .9rem; margin-bottom: 20px; }
  .campo-grupo { margin-bottom: 16px; }
  .campo-grupo label { display: block; font-size: .85rem; color: #555; margin-bottom: 6px; }
  .campo-com-acao { display: flex; gap: 8px; }
  input[type=password], input[type=text], input[type=number], textarea, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 8px; font-size: .95rem; }
  textarea { min-height: 70px; resize: vertical; }
  .btn-icone-input { background: none; border: 1px solid #ddd; border-radius: 8px; padding: 0 12px; cursor: pointer; font-size: .8rem; }
  .btn-lolita { background: #c2185b; color: #fff; border: none; padding: 12px 20px; border-radius: 8px; font-size: 1rem; cursor: pointer; }
  .btn-lolita:hover { background: #a01449; }
  .btn-lolita:disabled { background: #ccc; cursor: not-allowed; }
  .btn-secundario { background: #eee; color: #555; border: none; padding: 8px 14px; border-radius: 8px; cursor: pointer; }
  .btn-excluir { background: #ffebee; color: #c62828; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
  .msg-erro-login { color: #c62828; font-size: .85rem; min-height: 20px; margin-top: 4px; }
  header { background: #fff; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,.06); display: none; }
  header.visivel { display: flex; }
  header h2 { font-size: 1.1rem; color: #333; }
  main#secao-painel { display: none; max-width: 900px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
  .card h3 { color: #333; margin-bottom: 14px; }
  .grid-campos { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .lista-produto { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #eee; }
  .lista-produto:last-child { border-bottom: none; }
  .lista-produto img { width: 54px; height: 54px; object-fit: cover; border-radius: 8px; margin-right: 12px; }
  .prod-info { display: flex; align-items: center; flex: 1; }
  .prod-nome { font-weight: bold; color: #333; }
  .prod-detalhe { font-size: .8rem; color: #999; }
  .fotos-preview { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .fotos-preview img { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #333; color: #fff; padding: 10px 20px; border-radius: 8px; display: none; font-size: .9rem; }
  @media (max-width: 600px) { .grid-campos { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<main id="secao-login">
  <section class="login-caixa">
    <h1>Acesso Restrito</h1>
    <p class="login-subtitulo">Informe a credencial cadastrada para gerenciar os produtos da loja.</p>
    <form id="form-login" novalidate>
      <div class="campo-grupo">
        <label for="senha-acesso">Senha do administrador</label>
        <div class="campo-com-acao">
          <input type="password" id="senha-acesso" autocomplete="current-password" required placeholder="Digite sua senha">
          <button type="button" id="btn-mostrar-senha" class="btn-icone-input">Mostrar</button>
        </div>
        <div id="msg-erro-login" class="msg-erro-login" role="alert"></div>
      </div>
      <button type="submit" id="btn-entrar" class="btn-lolita" style="width:100%;">Entrar no sistema</button>
    </form>
  </section>
</main>

<header id="topo-admin">
  <h2>Painel da Lolita Loja</h2>
  <button id="btn-sair" class="btn-secundario">Sair</button>
</header>

<main id="secao-painel">
  <div class="card">
    <h3 id="titulo-formulario">Cadastrar novo produto</h3>
    <input type="hidden" id="produto-id">
    <div class="grid-campos">
      <div class="campo-grupo"><label>Código</label><input type="text" id="f-codigo" placeholder="Ex: VST-001"></div>
      <div class="campo-grupo"><label>Nome</label><input type="text" id="f-nome" placeholder="Ex: Vestido Midi Floral"></div>
      <div class="campo-grupo"><label>Categoria</label><input type="text" id="f-categoria" placeholder="Ex: Vestidos"></div>
      <div class="campo-grupo"><label>Preço</label><input type="number" id="f-preco" step="0.01" placeholder="0.00"></div>
      <div class="campo-grupo"><label>Tamanhos (separe por vírgula)</label><input type="text" id="f-tamanhos" placeholder="P,M,G"></div>
      <div class="campo-grupo"><label>Cores (separe por vírgula)</label><input type="text" id="f-cores" placeholder="Preto,Azul"></div>
    </div>
    <div class="campo-grupo"><label>Descrição</label><textarea id="f-descricao"></textarea></div>
    <div class="campo-grupo"><label>Fotos</label><input type="file" id="f-fotos" accept="image/*" multiple>
      <div id="fotos-preview" class="fotos-preview"></div>
    </div>
    <button id="btn-salvar" class="btn-lolita">Salvar produto</button>
    <button id="btn-cancelar" class="btn-secundario" style="display:none;">Cancelar edição</button>
  </div>

  <div class="card">
    <h3>Produtos cadastrados</h3>
    <div id="lista-produtos"></div>
  </div>
</main>

<div id="toast"></div>

<script>
const SENHA_SESSAO = 'lolita_senha';

let produtos = [];
let fotosNovas = [];   // arquivos escolhidos (File)
let fotosAtuais = [];  // URLs já salvas no produto em edição

function mostrarToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function authHeaders(extra) {
  const h = extra || {};
  h['Authorization'] = 'Bearer ' + sessionStorage.getItem(SENHA_SESSAO);
  return h;
}

/* ---------------- LOGIN ---------------- */
document.getElementById('btn-mostrar-senha').addEventListener('click', () => {
  const campo = document.getElementById('senha-acesso');
  const ehSenha = campo.type === 'password';
  campo.type = ehSenha ? 'text' : 'password';
  document.getElementById('btn-mostrar-senha').textContent = ehSenha ? 'Ocultar' : 'Mostrar';
});

document.getElementById('form-login').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgErro = document.getElementById('msg-erro-login');
  const btn = document.getElementById('btn-entrar');
  msgErro.textContent = '';
  btn.disabled = true;
  btn.textContent = 'Verificando...';

  try {
    const resposta = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha: document.getElementById('senha-acesso').value })
    });

    if (!resposta.ok) {
      msgErro.textContent = 'Senha incorreta. Verifique as maiúsculas e caracteres.';
      return;
    }

    sessionStorage.setItem(SENHA_SESSAO, document.getElementById('senha-acesso').value);
    abrirPainel();
  } catch (err) {
    msgErro.textContent = 'Erro de conexão. Tente novamente.';
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar no sistema';
  }
});

function abrirPainel() {
  document.getElementById('secao-login').style.display = 'none';
  document.getElementById('topo-admin').classList.add('visivel');
  document.getElementById('secao-painel').style.display = 'block';
  carregarProdutos();
}

document.getElementById('btn-sair').addEventListener('click', () => {
  sessionStorage.removeItem(SENHA_SESSAO);
  location.reload();
});

/* ---------------- FOTOS ---------------- */
document.getElementById('f-fotos').addEventListener('change', (e) => {
  fotosNovas = Array.from(e.target.files);
  renderizarFotosPreview();
});

function renderizarFotosPreview() {
  const div = document.getElementById('fotos-preview');
  div.innerHTML = '';
  fotosAtuais.forEach(url => {
    const img = document.createElement('img');
    img.src = url;
    div.appendChild(img);
  });
  fotosNovas.forEach(arquivo => {
    const img = document.createElement('img');
    img.src = URL.createObjectURL(arquivo);
    div.appendChild(img);
  });
}

async function enviarFotos(codigoProduto) {
  const urls = [];
  for (const arquivo of fotosNovas) {
    const fd = new FormData();
    fd.append('arquivo', arquivo);
    fd.append('codigo', codigoProduto);
    const resposta = await fetch('/api/upload', { method: 'POST', headers: authHeaders(), body: fd });
    if (!resposta.ok) throw new Error('Falha no upload de foto');
    const dados = await resposta.json();
    urls.push(dados.url);
  }
  return urls;
}

/* ---------------- PRODUTOS ---------------- */
async function carregarProdutos() {
  try {
    const resposta = await fetch('/api/produtos');
    produtos = resposta.ok ? await resposta.json() : [];
  } catch (e) {
    mostrarToast('Erro ao carregar produtos.');
    produtos = [];
  }
  renderizarLista();
}

function renderizarLista() {
  const div = document.getElementById('lista-produtos');
  div.innerHTML = '';
  if (produtos.length === 0) {
    div.innerHTML = '<p style="color:#999;">Nenhum produto cadastrado ainda.</p>';
    return;
  }
  produtos.forEach(p => {
    const linha = document.createElement('div');
    linha.className = 'lista-produto';
    const foto = (p.imagens && p.imagens[0]) || p.imagem || '';
    linha.innerHTML =
      '<div class="prod-info">' +
        (foto ? '<img src="' + foto + '">' : '') +
        '<div><div class="prod-nome">' + (p.nome || '') + '</div>' +
        '<div class="prod-detalhe">' + (p.codigo || '') + ' — R$ ' + (p.preco || '0.00') + '</div></div>' +
      '</div>' +
      '<div>' +
        '<button class="btn-secundario" data-editar="' + p.id + '">Editar</button> ' +
        '<button class="btn-excluir" data-excluir="' + p.id + '">Excluir</button>' +
      '</div>';
    div.appendChild(linha);
  });

  div.querySelectorAll('[data-editar]').forEach(b => b.addEventListener('click', () => editarProduto(b.dataset.editar)));
  div.querySelectorAll('[data-excluir]').forEach(b => b.addEventListener('click', () => excluirProduto(b.dataset.excluir)));
}

document.getElementById('btn-salvar').addEventListener('click', async () => {
  const btn = document.getElementById('btn-salvar');
  const nome = document.getElementById('f-nome').value.trim();
  if (!nome) { mostrarToast('O nome do produto é obrigatório.'); return; }

  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    const idEdicao = document.getElementById('produto-id').value;
    const codigo = document.getElementById('f-codigo').value.trim() || ('PRD-' + Date.now());

    const urlsNovas = await enviarFotos(codigo);
    const imagens = fotosAtuais.concat(urlsNovas);

    const corpo = {
      id: idEdicao || undefined,
      codigo: codigo,
      nome: nome,
      categoria: document.getElementById('f-categoria').value.trim(),
      preco: parseFloat(document.getElementById('f-preco').value) || 0,
      tamanhos: document.getElementById('f-tamanhos').value.trim(),
      cores: document.getElementById('f-cores').value.trim(),
      descricao: document.getElementById('f-descricao').value.trim(),
      imagens: imagens
    };

    const resposta = await fetch('/api/produtos', {
      method: idEdicao ? 'PUT' : 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(corpo)
    });

    if (!resposta.ok) {
      const erro = await resposta.text();
      throw new Error(erro);
    }

    mostrarToast('Produto salvo com sucesso.');
    limparFormulario();
    await carregarProdutos();
  } catch (err) {
    mostrarToast('Erro ao salvar: ' + err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Salvar produto';
  }
});

function editarProduto(id) {
  const p = produtos.find(x => x.id === id);
  if (!p) return;
  document.getElementById('produto-id').value = p.id;
  document.getElementById('f-codigo').value = p.codigo || '';
  document.getElementById('f-nome').value = p.nome || '';
  document.getElementById('f-categoria').value = p.categoria || '';
  document.getElementById('f-preco').value = p.preco || '';
  document.getElementById('f-tamanhos').value = p.tamanhos || '';
  document.getElementById('f-cores').value = p.cores || '';
  document.getElementById('f-descricao').value = p.descricao || '';
  fotosAtuais = (p.imagens && p.imagens.slice()) || (p.imagem ? [p.imagem] : []);
  fotosNovas = [];
  renderizarFotosPreview();
  document.getElementById('titulo-formulario').textContent = 'Editando: ' + (p.nome || '');
  document.getElementById('btn-cancelar').style.display = 'inline-block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('btn-cancelar').addEventListener('click', limparFormulario);

function limparFormulario() {
  document.getElementById('produto-id').value = '';
  document.getElementById('form-login').reset;
  ['f-codigo','f-nome','f-categoria','f-preco','f-tamanhos','f-cores','f-descricao'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('f-fotos').value = '';
  fotosNovas = [];
  fotosAtuais = [];
  renderizarFotosPreview();
  document.getElementById('titulo-formulario').textContent = 'Cadastrar novo produto';
  document.getElementById('btn-cancelar').style.display = 'none';
}

async function excluirProduto(id) {
  if (!confirm('Excluir este produto? Esta ação não pode ser desfeita.')) return;
  try {
    const resposta = await fetch('/api/produtos?id=' + encodeURIComponent(id), {
      method: 'DELETE',
      headers: authHeaders()
    });
    if (!resposta.ok) throw new Error(await resposta.text());
    mostrarToast('Produto excluído.');
    await carregarProdutos();
  } catch (err) {
    mostrarToast('Erro ao excluir: ' + err.message);
  }
}

/* ---------------- INICIALIZAÇÃO ---------------- */
if (sessionStorage.getItem(SENHA_SESSAO)) {
  abrirPainel();
}
</script>
</body>
</html>

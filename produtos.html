    // Silhuetas em SVG com traço rosa/ocre

      }
      if (tipo === "saia") {

   async function carregarProdutos() {
  try {
    const resp = await fetch("/api/produtos", { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    const dados = await resp.json();
    if (Array.isArray(dados) && dados.length > 0) {
      produtosCatalogo = dados.map(normalizarProdutoApi);
      return;
    }
  } catch (e) {
    console.warn("Falha ao carregar da API, usando exemplos:", e);
  }
  produtosCatalogo = [...PRODUTOS_EXEMPLO];
}

function normalizarProdutoApi(p) {
  let fotos = [];
  try { fotos = Array.isArray(p.fotos) ? p.fotos : JSON.parse(p.fotos || "[]"); } catch (e) { fotos = []; }
  let tamanhos = [];
  try { tamanhos = Array.isArray(p.tamanhos) ? p.tamanhos : JSON.parse(p.tamanhos || "[]"); } catch (e) { tamanhos = []; }
  let cores = [];
  try { cores = Array.isArray(p.cores) ? p.cores : JSON.parse(p.cores || "[]"); } catch (e) { cores = []; }
  cores = cores.map(function (c) { return typeof c === "string" ? { nome: c, hex: "#E8B7B0" } : c; });
  const idx = Number(p.foto_principal) || 0;
  return {
    id: p.id,
    codigo: p.codigo,
    nome: p.nome,
    categoria: p.categoria,
    preco: p.preco,
    descricao: p.descricao || "",
    tamanhos: tamanhos,
    cores: cores,
    fotos: fotos,
    foto_principal: idx,
    imagem: fotos[idx] || fotos[0] || p.categoria,
    novo: !!p.novo,
    destaque: !!p.destaque
  };
}
    // Formatar Preço em BRL com vírgula
    function formatarMoeda(valor) {
      if (typeof valor !== "number") {
        valor = parseFloat(valor) || 0;
      }
      return valor.toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    // Renderizar Renderizador de Imagem (Data URL ou Silhueta)
    function caminhoImagem(valor) {
  if (!valor || typeof valor !== "string") return "";
  const v = valor.trim();
  if (v.startsWith("/fotos/") || v.startsWith("http") || v.startsWith("data:")) return v;
  return "/fotos/" + v;
}

function renderizarImagemProduto(produto, classeCss) {
  const caminho = caminhoImagem(produto.imagem);
  if (caminho) {
    return '<img src="' + caminho + '" alt="' + produto.nome + '" class="' + classeCss + '" loading="lazy" onerror="this.style.display=\'none\'">';
  }
  return gerarSvgSilhueta(produto.imagem || produto.categoria);
}

    // Efeito 3D nos Cards (MouseMove)
    function anexarEfeitoTilt(card) {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      if (window.matchMedia("(hover: none)").matches) return;

      card.addEventListener("mousemove", (e) => {
        const ret = card.getBoundingClientRect();
        const x = e.clientX - ret.left;
        const y = e.clientY - ret.top;
        const centroX = ret.width / 2;
        const centroY = ret.height / 2;
        const deltaX = (x - centroX) / centroX;
        const deltaY = (y - centroY) / centroY;

        const maxGraus = 6;
        const rotX = -deltaY * maxGraus;
        const rotY = deltaX * maxGraus;

        card.style.transform = `perspective(900px) rotateX(${rotX.toFixed(2)}deg) rotateY(${rotY.toFixed(2)}deg) translateY(-4px)`;
      });

      card.addEventListener("mouseleave", () => {
        card.style.transform = "perspective(900px) rotateX(0deg) rotateY(0deg) translateY(0)";
      });
    }

    // Filtrar e Ordenar Peças
    function obterProdutosFiltrados() {
      return produtosCatalogo
        .filter(item => {
          // Categoria
          if (filtroCategoriaAtual !== "todos" && item.categoria.toLowerCase() !== filtroCategoriaAtual.toLowerCase()) {
            return false;
          }
          // Busca por nome ou código
          if (termoBuscaAtual) {
            const busca = termoBuscaAtual.toLowerCase().trim();
            const nomeMatch = (item.nome || "").toLowerCase().includes(busca);
            const codigoMatch = (item.codigo || "").toLowerCase().includes(busca);
            if (!nomeMatch && !codigoMatch) {
              return false;
            }
          }
          return true;
        })
        .sort((a, b) => {
          if (ordenacaoAtual === "menor_preco") {
            return (a.preco || 0) - (b.preco || 0);
          }
          if (ordenacaoAtual === "maior_preco") {
            return (b.preco || 0) - (a.preco || 0);
          }
          if (ordenacaoAtual === "nome_az") {
            return (a.nome || "").localeCompare(b.nome || "");
          }
          // Relevância: novidades e destaques primeiro
          if (a.novo && !b.novo) return -1;
          if (!a.novo && b.novo) return 1;
          if (a.destaque && !b.destaque) return -1;
          if (!a.destaque && b.destaque) return 1;
          return 0;
        });
    }

    // Renderizar Grade do Catálogo

        function montarCarrossel(produto, tagNovidade) {
      const lista = (produto.fotos && produto.fotos.length)
        ? produto.fotos.map(caminhoImagem).filter(Boolean)
        : [caminhoImagem(produto.imagem)].filter(Boolean);
      if (lista.length === 0) {
        return '<div class="detalhe-moldura">' + (tagNovidade || "") + gerarSvgSilhueta(produto.categoria) + '</div>';
      }
      if (lista.length === 1) {
        return '<div class="detalhe-moldura">' + (tagNovidade || "") + '<img src="' + lista[0] + '" alt="' + produto.nome + '"></div>';
      }
      const slides = lista.map(function (src, i) {
        return '<div class="carrossel-slide"><img src="' + src + '" alt="' + produto.nome + ' — foto ' + (i + 1) + ' de ' + lista.length + '"></div>';
      }).join("");
      const pontos = lista.map(function (_, i) {
        return '<button type="button" class="carrossel-ponto ' + (i === 0 ? "ativo" : "") + '" onclick="irParaFoto(' + i + ')" aria-label="Ir para foto ' + (i + 1) + '"></button>';

        '<button type="button" class="carrossel-seta direita" onclick="moverCarrossel(1)" aria-label="Próxima foto"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>' +
        '<div class="carrossel-pontos">' + pontos + '</div>' +

    function moverCarrossel(direcao) {

    // Disparar efeito Ripple
    function criarRipple(event, elemento) {
      const circulo = document.createElement("span");
      const ret = elemento.getBoundingClientRect();
      const diametro = Math.max(ret.width, ret.height);
      const raio = diametro / 2;

      circulo.style.width = circulo.style.height = `${diametro}px`;
      circulo.style.left = `${event.clientX - ret.left - raio}px`;
      circulo.style.top = `${event.clientY - ret.top - raio}px`;
      circulo.classList.add("ripple-efeito");

      const existente = elemento.querySelector(".ripple-efeito");
      if (existente) existente.remove();

      elemento.appendChild(circulo);
      setTimeout(() => circulo.remove(), 600);

      svg.appendChild(tx);
    });
  }

  // line(el, {labels:[], values:[], color?, format?}) — single-series line.
  function line(el, cfg) {
    var W = 640, H = 280, padL = 46, padB = 30, padT = 12;
    var svg = frame(el, W, H);
    var max = maxOf(cfg.values);
    var n = cfg.values.length;
    var plotW = W - padL - 16, plotH = H - padT - padB;
    var color = cfg.color || accent();
    var f = coerceFormat(cfg.format);
    for (var g = 0; g <= 4; g++) {
      var gy = padT + plotH - (plotH * g) / 4;
      svg.appendChild(svgEl("line", { x1: padL, y1: gy, x2: W - 16, y2: gy, stroke: "currentColor", "stroke-opacity": 0.08 }));
      var lbl = svgEl("text", { x: padL - 8, y: gy + 4, "text-anchor": "end", "font-size": 10, fill: mutedColor() });
      lbl.textContent = axisFmt((max * g) / 4);
      svg.appendChild(lbl);
    }
    var pts = cfg.values.map(function (v, i) {
      var x = padL + (n === 1 ? plotW / 2 : (plotW * i) / (n - 1));
      var y = padT + plotH - (v / max) * plotH;
      return [x, y];
    });
    var d = pts.map(function (p, i) { return (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1); }).join(" ");
    svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: color, "stroke-width": 2, "stroke-linejoin": "round" }));
    pts.forEach(function (p, i) {
      var c = svgEl("circle", { cx: p[0], cy: p[1], r: 3.5, fill: color });
      var t = svgEl("title", {});
      t.textContent = cfg.labels[i] + ": " + f(cfg.values[i]);
      c.appendChild(t);
      svg.appendChild(c);
      var tx = svgEl("text", { x: p[0], y: H - 10, "text-anchor": "middle", "font-size": 11, fill: mutedColor() });
      tx.textContent = cfg.labels[i];
      svg.appendChild(tx);
    });
  }

  // donut(el, {labels:[], values:[], colors?}) — donut with center total.
  function donut(el, cfg) {
    var W = 320, H = 280, cx = W / 2, cy = H / 2, R = 92, r = 58;
    var svg = frame(el, W, H);
    var total = cfg.values.reduce(function (a, b) { return a + b; }, 0) || 1;
    var palette = cfg.colors || [accent(), "#1baf7a", "#eda100", "#e34948", "#4a3aa7", "#e87ba4"];
    var a0 = -Math.PI / 2;
    cfg.values.forEach(function (v, i) {
      var a1 = a0 + (v / total) * Math.PI * 2;
      var large = a1 - a0 > Math.PI ? 1 : 0;
      var p = ["M", cx + R * Math.cos(a0), cy + R * Math.sin(a0),
        "A", R, R, 0, large, 1, cx + R * Math.cos(a1), cy + R * Math.sin(a1),
        "L", cx + r * Math.cos(a1), cy + r * Math.sin(a1),
        "A", r, r, 0, large, 0, cx + r * Math.cos(a0), cy + r * Math.sin(a0), "Z"].join(" ");
      var path = svgEl("path", { d: p, fill: palette[i % palette.length] });
      var t = svgEl("title", {});
      t.textContent = cfg.labels[i] + ": " + fmt.num(v) + " (" + fmt.pct(v / total) + ")";
      path.appendChild(t);
      svg.appendChild(path);
      a0 = a1;
    });
    var center = svgEl("text", { x: cx, y: cy + 5, "text-anchor": "middle", "font-size": 20, "font-weight": 650, fill: "currentColor" });
    center.textContent = fmt.num(total);
    svg.appendChild(center);
  }

  window.skipShell = { fmt: fmt };
  window.skipChart = { bar: bar, line: line, donut: donut };
})();

</script>
</body>
</html>
